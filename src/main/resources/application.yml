spring:
  application:
    name: mildang-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB      # 명세 §5.3 — 이미지 10MB 이하 (Spring 기본 1MB라 명시 필수)
      max-request-size: 12MB
  web:
    resources:
      cache:
        cachecontrol:
          # 데모 프론트(/app·/tester)를 배포한 뒤에도 브라우저가 예전 화면을 계속 띄우는 문제.
          # 새 탭에서도 캐시가 살아서 «고쳤는데 그대로»로 보인다 — 정적 자원은 캐시하지 않는다.
          no-store: true

server:
  servlet:
    context-path: /v1

mildang:
  # 공유 딥링크에 찍히는 주소 — 배포 시 실제 도메인으로 반드시 덮어쓸 것
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  demo:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:mildang-dev-secret-key-32bytes-min!!}
    access-ttl-seconds: 1800
    refresh-ttl-days: 60
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    fake: ${AI_FAKE:false}
    # AI가 멈추면 요청 스레드 + DB 커넥션을 붙잡는다 — 반드시 상한을 둔다 (스캔이 20초대라 read는 여유 있게)
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
  toss:
    # 결제창용 — 브라우저에 노출돼도 되는 값
    client-key: ${TOSS_CLIENT_KEY:}
    # 승인 API용 — 서버만 쓴다. 없으면 결제 경로가 닫힌다
    secret-key: ${TOSS_SECRET_KEY:}
    confirm-uri: ${TOSS_CONFIRM_URI:https://api.tosspayments.com/v1/payments/confirm}
    timeout: ${TOSS_TIMEOUT:10s}
  kakao:
    # prod에서 id_token의 aud와 대조할 카카오 앱 키 — 없으면 prod 기동이 실패한다(의도된 동작).
    # 로그인 방식에 따라 aud에 들어가는 키가 다르다(JS SDK=JavaScript 키, 서버 교환=REST API 키)
    # → 콤마로 여러 개를 넣어두면 어느 쪽이든 통과한다.  예: KAKAO_APP_KEY=abc...,def...
    app-key: ${KAKAO_APP_KEY:}
    # 인가 코드를 토큰으로 바꿀 때 client_id로 쓴다 (콘솔의 REST API 키)
    rest-api-key: ${KAKAO_REST_API_KEY:}
    # 콘솔에서 «보안 → Client Secret»을 켰다면 넣는다. 안 켰으면 비워둔다
    client-secret: ${KAKAO_CLIENT_SECRET:}
    issuer: ${KAKAO_ISSUER:https://kauth.kakao.com}
    jwks-uri: ${KAKAO_JWKS_URI:https://kauth.kakao.com/.well-known/jwks.json}
    timeout: ${KAKAO_TIMEOUT:3s}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:mildang;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

mildang:
  ai:
    fake: ${AI_FAKE:true}   # 로컬 기본은 fake — 실 AI-Server 붙이려면 AI_FAKE=false

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mildang}
    username: ${DB_USERNAME:mildang}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

mildang:
  demo:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}

---
# 폰에서 «스토리에 공유하기»(Web Share API)를 시험할 때만 쓰는 프로필.
# 브라우저는 HTTPS(또는 localhost)가 아니면 navigator.share를 아예 열어주지 않는다.
# 자체 서명 인증서라 폰에서 «안전하지 않음» 경고가 뜬다 — 계속을 눌러 들어가면 된다.
spring:
  config:
    activate:
      on-profile: https
  ssl:
    bundle:
      jks:
        dev:
          keystore:
            location: classpath:mildang-dev.p12
            password: mildang-dev
            type: PKCS12

server:
  port: 8443
  ssl:
    bundle: dev
