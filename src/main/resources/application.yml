spring:
  application:
    name: mildang-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB      # 명세 §5.3 — 이미지 10MB 이하 (Spring 기본 1MB라 명시 필수)
      max-request-size: 12MB

server:
  servlet:
    context-path: /v1

mildang:
  demo:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:mildang-dev-secret-key-32bytes-min!!}
    access-ttl-seconds: 1800
    refresh-ttl-days: 60
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    fake: ${AI_FAKE:false}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:mildang;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

mildang:
  ai:
    fake: ${AI_FAKE:true}   # 로컬 기본은 fake — 실 AI-Server 붙이려면 AI_FAKE=false

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mildang}
    username: ${DB_USERNAME:mildang}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

mildang:
  demo:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
